services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: zc
      POSTGRES_PASSWORD: zc
      POSTGRES_DB: zenithcore
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zc"]
      interval: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://zc:zc@db:5432/zenithcore
      JWT_SECRET: change-me-in-every-environment
      DEMO_MODE: "1"
      LOG_REQUESTS: "1"
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata: {}

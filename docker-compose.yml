services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: zc
      POSTGRES_PASSWORD: zc
      POSTGRES_DB: zenithcore
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zc"]
      interval: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://zc:zc@db:5432/zenithcore
      JWT_SECRET: change-me-in-every-environment
      DEMO_MODE: "1"
      LOG_REQUESTS: "1"
      CBS_URL: http://cbs:8090
      CBS_PUBLIC_URL: http://localhost:8090
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
      cbs: { condition: service_started }
  cbs:
    # Central Bank of Syria payment sandbox (simulation for testing and demonstration only)
    build: .
    command: ["npm", "run", "start:cbs"]
    ports: ["8090:8090"]
volumes:
  pgdata: {}
